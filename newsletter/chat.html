<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== RESET ===== */
*,
*::before,
*::after{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
}

body{
  font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:#0f141a;
  color:#e6edf3;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}

/* ===== FOCUS (ACCESSIBILITY) ===== */
:focus-visible{
  outline:2px solid #58a6ff;
  outline-offset:2px;
}

/* ===== TOP BAR ===== */
.topbar{
  position:sticky;
  top:0;
  background:#161b22;
  padding:14px 24px;
  font-weight:700;
  border-bottom:1px solid #2a313c;
  z-index:100;
}

/* ===== LAYOUT ===== */
.container{
  display:flex;
  max-width:1100px;
  margin:20px auto;
  gap:20px;
  padding:0 16px;
  align-items:flex-start;
}

.main{
  flex:2;
  min-width:0;
}

.rightbar{
  width:300px;
  max-width:100%;
}

/* ===== NAME MODAL ===== */
#nameModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:16px;
}

.name-box{
  background:#161b22;
  padding:28px;
  border-radius:16px;
  width:100%;
  max-width:340px;
  text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}

.name-box h2{
  margin:0 0 8px;
}

/* ===== INPUTS ===== */
input,
textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #2a313c;
  background:#0d1117;
  color:white;
  font-family:inherit;
  font-size:14px;
  resize:vertical;
}

textarea{
  min-height:90px;
}

input::placeholder,
textarea::placeholder{
  color:#8b949e;
}

/* ===== BUTTONS ===== */
button{
  font-family:inherit;
}

.name-box button,
#postModal button{
  width:100%;
  margin-top:12px;
  padding:11px 14px;
  border:none;
  border-radius:10px;
  background:#ff4500;
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:background .15s ease, transform .05s ease;
}

.name-box button:hover,
#postModal button:hover{
  background:#ff5a1f;
}

button:active{
  transform:translateY(1px);
}

/* ===== POST BOX ===== */
#postModal{
  background:#161b22;
  padding:18px;
  border-radius:16px;
  margin-bottom:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* ===== POST CARD ===== */
.card{
  background:#161b22;
  padding:14px 16px;
  border-radius:14px;
  margin-bottom:14px;
  cursor:pointer;
  transition:background .15s ease, transform .1s ease;
  border:1px solid transparent;
  word-wrap:break-word;
}

.card:hover{
  background:#1d232b;
  border-color:#2a313c;
}

.post-title{
  font-weight:600;
  font-size:1rem;
  margin-bottom:4px;
}

.post-meta{
  font-size:.8rem;
  color:#8b949e;
  margin-bottom:6px;
}

.top-reply{
  margin-top:10px;
  padding:8px 10px;
  background:#0d1117;
  border-radius:8px;
  font-size:.9rem;
  color:#c9d1d9;
  word-break:break-word;
}

.view-more{
  font-size:.8rem;
  color:#58a6ff;
  margin-top:6px;
}

/* ===== CHAT ===== */
#chatBox{
  height:420px;
  overflow:auto;
  background:#161b22;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  font-size:.9rem;
  border:1px solid #2a313c;
}

.chat-user{
  color:#ffb000;
  font-weight:600;
}

#chatInput{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #2a313c;
  background:#0d1117;
  color:white;
}

#chatBtn{
  width:100%;
  margin-top:6px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#238636;
  color:white;
  font-weight:600;
  cursor:pointer;
}

#chatBtn:hover{
  background:#2ea043;
}

/* ===== EXPANDED VIEW ===== */
#expandedPost{
  display:none;
  position:fixed;
  inset:0;
  background:#0f141a;
  padding:28px;
  overflow:auto;
  z-index:9998;
}

.closeBtn{
  position:absolute;
  top:16px;
  right:16px;
  background:#ff4500;
  border:none;
  padding:9px 12px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

/* ===== REPLIES ===== */
.reply{
  margin-left:calc(var(--depth) * 18px);
  background:#161b22;
  padding:10px 12px;
  border-radius:10px;
  margin-top:10px;
  border:1px solid #2a313c;
  word-break:break-word;
}

.reply-author{
  font-weight:600;
  color:#8b949e;
  font-size:.8rem;
  margin-bottom:2px;
}

.reply-btn{
  font-size:.75rem;
  color:#58a6ff;
  cursor:pointer;
  margin-top:4px;
  user-select:none;
}

.reply-input{
  width:100%;
  margin-top:6px;
  padding:7px;
  border-radius:8px;
  border:1px solid #2a313c;
  background:#0d1117;
  color:white;
}

/* ===== MOBILE ===== */
@media (max-width:900px){
  .container{
    flex-direction:column;
  }
  .rightbar{
    width:100%;
  }
}
</style>
</head>
<body>

<div class="topbar">🔥 Challenge Feed</div>

<!-- NAME MODAL -->
<div id="nameModal">
  <div class="name-box">
    <h2>Pick your username</h2>
    <input id="usernameInput" placeholder="u/yourname">
    <button id="saveUsername">Continue</button>
  </div>
</div>

<div class="container">
  <div class="main">
    <div id="postModal">
      <input id="title" placeholder="Post title">
      <textarea id="content" placeholder="What's on your mind?"></textarea>
      <button id="postBtn">Post</button>
    </div>
    <div id="feed"></div>
  </div>

  <div class="rightbar">
    <h3>💬 Live Chat</h3>
    <div id="chatBox"></div>
    <input id="chatInput" placeholder="Message...">
    <button id="chatBtn">Send</button>
  </div>
</div>

<!-- EXPANDED VIEW -->
<div id="expandedPost">
  <button class="closeBtn">Close</button>
  <h2 id="expTitle"></h2>
  <div id="expAuthor"></div>
  <div id="expContent"></div>

  <input id="expReplyInput" placeholder="Write a reply…">
  <button id="expReplyBtn">Reply</button>

  <div id="expReplies"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, increment, updateDoc, doc, limit, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* USERNAME */
let currentUser=localStorage.getItem("challenge_username");
const modal=document.getElementById("nameModal");
if(!currentUser) modal.style.display="flex";
else modal.style.display="none";

document.getElementById("saveUsername").onclick=()=>{
  let v=document.getElementById("usernameInput").value.trim();
  if(!v) return;
  currentUser=v.startsWith("u/")?v:"u/"+v;
  localStorage.setItem("challenge_username",currentUser);
  modal.style.display="none";
};

/* FIREBASE */
const app=initializeApp({
  apiKey:"AIzaSyA-X3aamm3--C3OvknHs3nYUOcDChuNTC8",
  authDomain:"challenge-reddit.firebaseapp.com",
  projectId:"challenge-reddit",
});
const db=getFirestore(app);

/* CREATE POST */
document.getElementById("postBtn").onclick=async()=>{
  const title=document.getElementById("title").value.trim();
  const content=document.getElementById("content").value.trim();
  if(!title||!content) return;

  await addDoc(collection(db,"posts"),{
    name:currentUser,title,content,timestamp:Date.now(),upvotes:0
  });

  document.getElementById("title").value="";
  document.getElementById("content").value="";
};

/* LOAD POSTS */
const feed=document.getElementById("feed");
const postQuery=query(collection(db,"posts"),orderBy("timestamp","desc"),limit(20));

onSnapshot(postQuery,snap=>{
  feed.innerHTML="";
  snap.forEach(d=>{
    const p=d.data(); const id=d.id;

    const el=document.createElement("div");
    el.className="card";
    el.innerHTML=`
      <div class="post-title">${p.title}</div>
      <div class="post-meta">Posted by ${p.name}</div>
      <div>${p.content.substring(0,120)}...</div>
      <div id="topReply_${id}" class="top-reply"></div>
      <div class="view-more">View more replies…</div>
    `;
    feed.appendChild(el);

    // LOAD TOP REPLY ONLY
    const topQuery=query(
      collection(db,"replies_"+id),
      where("parentId","==",null),
      orderBy("timestamp","asc"),
      limit(1)
    );

    onSnapshot(topQuery,s=>{
      const box=document.getElementById(`topReply_${id}`);
      if(s.empty){ box.textContent="No replies yet."; return; }
      const r=s.docs[0].data();
      box.innerHTML=`<b>${r.author}</b>: ${r.msg}`;
    });

    el.onclick=()=>openExpanded(id,p);
  });
});

/* EXPANDED VIEW */
let currentPostId=null;

function openExpanded(id,p){
  currentPostId=id;
  expandedPost.style.display="block";
  expTitle.textContent=p.title;
  expAuthor.textContent="Posted by "+p.name;
  expContent.textContent=p.content;
  loadRepliesTree();
}

document.querySelector(".closeBtn").onclick=()=>{
  expandedPost.style.display="none";
};

document.getElementById("expReplyBtn").onclick=async()=>{
  const msg=document.getElementById("expReplyInput").value.trim();
  if(!msg) return;

  await addDoc(collection(db,"replies_"+currentPostId),{
    msg,author:currentUser,parentId:null,timestamp:Date.now()
  });

  document.getElementById("expReplyInput").value="";
};

/* THREAD RENDER */
function loadRepliesTree(){
  const container=document.getElementById("expReplies");
  const q=query(collection(db,"replies_"+currentPostId),orderBy("timestamp","asc"));

  onSnapshot(q,snap=>{
    const all=snap.docs.map(d=>({id:d.id,...d.data()}));
    container.innerHTML="";
    renderLevel(all,null,0);
  });

  function renderLevel(all,parent,depth){
    all.filter(r=>r.parentId===parent).forEach(r=>{
      const div=document.createElement("div");
      div.className="reply";
      div.style.setProperty("--depth",depth);
      div.innerHTML=`
        <div class="reply-author">${r.author}</div>
        <div>${r.msg}</div>
        <div class="reply-btn">Reply</div>
        <div class="reply-box"></div>
      `;
      container.appendChild(div);

      const btn=div.querySelector(".reply-btn");
      const box=div.querySelector(".reply-box");

      btn.onclick=()=>{
        box.innerHTML=`
          <input class="reply-input" placeholder="Reply…">
          <button class="reply-btn">Send</button>
        `;
        box.querySelector("button").onclick=async()=>{
          const msg=box.querySelector("input").value.trim();
          if(!msg) return;
          await addDoc(collection(db,"replies_"+currentPostId),{
            msg,author:currentUser,parentId:r.id,timestamp:Date.now()
          });
          box.innerHTML="";
        };
      };

      renderLevel(all,r.id,depth+1);
    });
  }
}

/* CHAT */
const chatBox=document.getElementById("chatBox");
document.getElementById("chatBtn").onclick=sendChat;
document.getElementById("chatInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") sendChat();
});

async function sendChat(){
  const input=document.getElementById("chatInput");
  const msg=input.value.trim();
  if(!msg) return;
  await addDoc(collection(db,"chat"),{
    msg,author:currentUser,timestamp:Date.now()
  });
  input.value="";
}

const chatQuery=query(collection(db,"chat"),orderBy("timestamp","asc"));
onSnapshot(chatQuery,snap=>{
  chatBox.innerHTML="";
  snap.forEach(c=>{
    chatBox.innerHTML+=`<div><span class="chat-user">${c.data().author}:</span> ${c.data().msg}</div>`;
  });
  chatBox.scrollTop=chatBox.scrollHeight;
});
</script>
</body>
</html>
