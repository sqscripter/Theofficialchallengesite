<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* ===== GLOBAL ===== */
body{
  font-family:"Inter",sans-serif;
  background:#0f141a;
  color:#e6edf3;
  margin:0;
}

/* ===== TOP BAR ===== */
.topbar{
  position:sticky;
  top:0;
  background:#161b22;
  padding:14px 24px;
  font-weight:700;
  font-size:1.2rem;
  border-bottom:1px solid #2a313c;
  z-index:100;
}

/* ===== LAYOUT ===== */
.container{
  display:flex;
  max-width:1100px;
  margin:20px auto;
  gap:20px;
  padding:0 16px;
}
.main{flex:2;}
.rightbar{width:300px;}

/* ===== NAME MODAL ===== */
#nameModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.name-box{
  background:#161b22;
  padding:28px;
  border-radius:18px;
  width:320px;
  text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
}
.name-box h2{margin-top:0;}
.name-box input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #2a313c;
  background:#0d1117;
  color:white;
  margin-top:10px;
}
.name-box button{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#ff4500;
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* ===== POST BOX ===== */
#postModal{
  background:#161b22;
  padding:18px;
  border-radius:16px;
  margin-bottom:20px;
}
#postModal input,#postModal textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #2a313c;
  background:#0d1117;
  color:white;
}
#postModal button{
  margin-top:12px;
  background:#ff4500;
  border:none;
  padding:10px 18px;
  border-radius:10px;
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* ===== POST CARD ===== */
.card{
  display:flex;
  gap:12px;
  background:#161b22;
  padding:14px;
  border-radius:16px;
  margin-bottom:14px;
  cursor:pointer;
  transition:.15s;
}
.card:hover{background:#1d232b;}

.voteCol{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.voteArrow{
  cursor:pointer;
  font-size:18px;
  user-select:none;
  color:#8b949e;
}
.voteArrow:hover{color:#ff4500;}
.voteCount{font-weight:700;font-size:.9rem;}

.post-body{flex:1;}
.post-title{font-weight:700;margin-bottom:4px;}
.post-meta{font-size:.8rem;color:#8b949e;margin-bottom:6px;}

/* ===== CHAT ===== */
#chatBox{
  height:420px;
  overflow:auto;
  background:#161b22;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  font-size:.9rem;
}
.chat-user{color:#ffb000;font-weight:600;}
#chatInput{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #2a313c;
  background:#0d1117;
  color:white;
}
#chatBtn{
  width:100%;
  margin-top:6px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#238636;
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* ===== EXPANDED POST ===== */
#expandedPost{
  display:none;
  position:fixed;
  inset:0;
  background:#0f141a;
  padding:30px;
  overflow:auto;
  z-index:9998;
}
.closeBtn{
  position:absolute;
  top:20px;
  right:20px;
  background:#ff4500;
  border:none;
  padding:10px 14px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}
.reply{
  background:#161b22;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
}
.reply-author{font-weight:600;color:#8b949e;}
</style>
</head>
<body>

<div class="topbar">🔥 Challenge Feed</div>

<!-- NAME MODAL -->
<div id="nameModal">
  <div class="name-box">
    <h2>Pick your username</h2>
    <input id="usernameInput" placeholder="u/yourname">
    <button id="saveUsername">Continue</button>
  </div>
</div>

<div class="container">
  <div class="main">

    <div id="postModal">
      <input id="title" placeholder="Post title">
      <textarea id="content" placeholder="What's on your mind?"></textarea>
      <button id="postBtn">Post</button>
    </div>

    <div id="feed"></div>
  </div>

  <div class="rightbar">
    <h3>💬 Live Chat</h3>
    <div id="chatBox"></div>
    <input id="chatInput" placeholder="Message...">
    <button id="chatBtn">Send</button>
  </div>
</div>

<div id="expandedPost">
  <button class="closeBtn">Close</button>
  <h2 id="expTitle"></h2>
  <div id="expAuthor"></div>
  <div id="expContent"></div>
  <div id="expReplies"></div>

  <input id="expReplyInput" placeholder="Write a reply…">
  <button id="expReplyBtn">Reply</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, increment, updateDoc, doc, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* USERNAME */
let currentUser = localStorage.getItem("challenge_username");
const modal=document.getElementById("nameModal");

if(!currentUser) modal.style.display="flex";
else modal.style.display="none";

document.getElementById("saveUsername").onclick=()=>{
  let v=document.getElementById("usernameInput").value.trim();
  if(!v) return;
  currentUser=v.startsWith("u/")?v:"u/"+v;
  localStorage.setItem("challenge_username",currentUser);
  modal.style.display="none";
};

/* FIREBASE */
const app=initializeApp({
  apiKey:"AIzaSyA-X3aamm3--C3OvknHs3nYUOcDChuNTC8",
  authDomain:"challenge-reddit.firebaseapp.com",
  projectId:"challenge-reddit",
});
const db=getFirestore(app);

/* POSTS */
const feed=document.getElementById("feed");
document.getElementById("postBtn").onclick=async()=>{
  const title=document.getElementById("title").value.trim();
  const content=document.getElementById("content").value.trim();
  if(!title||!content) return;

  await addDoc(collection(db,"posts"),{
    name:currentUser,title,content,
    timestamp:Date.now(),upvotes:0
  });

  title.value="";content.value="";
};

const postQuery=query(collection(db,"posts"),orderBy("timestamp","desc"),limit(20));
onSnapshot(postQuery,snap=>{
  feed.innerHTML="";
  snap.forEach(d=>{
    const p=d.data(); const id=d.id;

    const el=document.createElement("div");
    el.className="card";
    el.innerHTML=`
      <div class="voteCol">
        <div class="voteArrow" id="up_${id}">▲</div>
        <div class="voteCount" id="count_${id}">${p.upvotes||0}</div>
      </div>
      <div class="post-body">
        <div class="post-title">${p.title}</div>
        <div class="post-meta">Posted by ${p.name}</div>
        <div>${p.content.substring(0,140)}...</div>
      </div>
    `;
    feed.appendChild(el);

    document.getElementById(`up_${id}`).onclick=(e)=>{
      e.stopPropagation();
      updateDoc(doc(db,"posts",id),{upvotes:increment(1)});
    };
  });
});

/* CHAT */
const chatBox=document.getElementById("chatBox");
document.getElementById("chatBtn").onclick=sendChat;
document.getElementById("chatInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") sendChat();
});

async function sendChat(){
  const input=document.getElementById("chatInput");
  const msg=input.value.trim();
  if(!msg) return;
  await addDoc(collection(db,"chat"),{
    msg,author:currentUser,timestamp:Date.now()
  });
  input.value="";
}

const chatQuery=query(collection(db,"chat"),orderBy("timestamp","asc"));
onSnapshot(chatQuery,snap=>{
  chatBox.innerHTML="";
  snap.forEach(c=>{
    chatBox.innerHTML+=`<div><span class="chat-user">${c.data().author}:</span> ${c.data().msg}</div>`;
  });
  chatBox.scrollTop=chatBox.scrollHeight;
});
</script>
</body>
</html>
