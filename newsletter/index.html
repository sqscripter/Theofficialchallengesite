<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Montserrat",system-ui;background:#0b0f14;color:#eee}
header{background:#1f1f1f;color:#fff;padding:18px 40px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.5)}
nav{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.6rem;font-weight:700;font-family:"Roboto Mono",monospace}
.nav-actions button{margin-left:12px}
.app{display:grid;grid-template-columns:260px 1fr 300px;min-height:calc(100vh - 80px)}
.sidebar,.rightbar{background:#0f141b;padding:20px;border-color:#1f2630}
.sidebar{border-right:1px solid #1f2630}
.rightbar{border-left:1px solid #1f2630}
.main{padding:20px;max-width:720px;margin:auto}
.card{background:#161b22;padding:16px;border-radius:14px;margin-bottom:16px;box-shadow:0 6px 22px rgba(0,0,0,.35);transition:.18s}
.card:hover{transform:translateY(-3px)}
.featured{border:2px solid #ffb703;margin-bottom:20px}
input,textarea{width:100%;margin-top:8px;margin-bottom:12px;padding:11px;border-radius:10px;border:1px solid #222a35;background:#0d1117;color:white}
textarea{min-height:90px;resize:vertical}
button{background:#e74c3c;border:none;padding:9px 14px;border-radius:10px;color:white;font-weight:700;cursor:pointer;transition:.15s}
button:hover{transform:translateY(-1px);filter:brightness(1.1)}
.vote{margin-top:10px}
.vote.bump{animation:bump .25s}@keyframes bump{50%{transform:scale(1.25)}}
.post-title{font-size:18px;font-weight:700;margin-bottom:4px}.name{color:#9aa4af;font-size:.85rem;margin-bottom:8px}.reply{margin-left:18px;margin-top:6px;color:#d0d7de;font-size:.9rem}.feed-scroll{max-height:calc(100vh - 140px);overflow:auto;padding-right:6px}
#chatBox{height:260px;overflow:auto;background:#0d1117;padding:10px;border-radius:10px}
.load-more{width:100%;margin:10px 0 30px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.25s;z-index:2000}.modal.show{opacity:1;pointer-events:auto}.modal-card{background:#161b22;padding:20px;border-radius:16px;width:95%;max-width:520px;transform:translateY(40px) scale(.95);transition:.25s}.modal.show .modal-card{transform:translateY(0) scale(1)}
.post-expanded{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;overflow:auto;z-index:3000}.post-expanded .modal-card{max-width:700px;max-height:90%;overflow:auto}
</style>
</head>
<body>
<header>
<nav>
<div class="logo">Challenge Feed</div>
<div class="nav-actions"><button id="openPost">+ Create Post</button></div>
</nav>
</header>
<div class="app">
<div class="sidebar">Home<br>Popular<br>New</div>
<div class="main">
<div id="featured" class="featured"></div>
<div class="feed-scroll" id="feedScroll">
<div id="feed"></div>
<button id="loadMore" class="load-more">Load More</button>
</div>
</div>
<div class="rightbar">
<h3>💬 Live Chat</h3>
<div id="chatBox"></div>
<input id="chatInput" placeholder="Message...">
<button id="chatBtn" style="width:100%">Send</button>
</div>
</div>
<div class="modal" id="postModal">
<div class="modal-card">
<h3 style="margin-top:0">Create Post</h3>
<input id="nameInput" placeholder="Your name">
<input id="titleInput" placeholder="Post title">
<textarea id="contentInput" placeholder="Write something..."></textarea>
<button id="postBtn">Post</button>
</div>
</div>
<div id="expandedPostContainer"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, limit, startAfter, getDocs, doc, updateDoc, increment } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig = {
apiKey: "AIzaSyA-X3aamm3--C3OvknHs3nYUOcDChuNTC8",
authDomain: "challenge-reddit.firebaseapp.com",
projectId: "challenge-reddit",
storageBucket: "challenge-reddit.firebasestorage.app",
messagingSenderId: "366868697602",
appId: "1:366868697602:web:08c3ffee581ab893388d1b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const feed = document.getElementById('feed');
const loadMoreBtn = document.getElementById('loadMore');
const feedScroll = document.getElementById('feedScroll');
let lastVisible=null, loading=false;
const modal=document.getElementById('postModal');
document.getElementById('openPost').onclick=function(){modal.classList.add('show')};
modal.onclick=function(e){if(e.target===modal) modal.classList.remove('show')};
document.getElementById('postBtn').onclick=async function(){
const name=nameInput.value.trim();
const title=titleInput.value.trim();
const content=contentInput.value.trim();
if(!name||!title||!content)return alert('Fill everything');
await addDoc(collection(db,'posts'),{name:name,title:title,content:content,timestamp:Date.now(),upvotes:0});
modal.classList.remove('show');
titleInput.value='';
contentInput.value='';
};
async function loadPosts(initial){
if(loading)return;
loading=true;
let q;
if(initial||!lastVisible){
q=query(collection(db,'posts'),orderBy('timestamp','desc'),limit(20));
}else{
q=query(collection(db,'posts'),orderBy('timestamp','desc'),startAfter(lastVisible),limit(20));
}
const snap=await getDocs(q);
if(initial) feed.innerHTML='';
snap.forEach(function(d){renderPost(d)});
lastVisible=snap.docs[snap.docs.length-1];
loading=false;
}
loadMoreBtn.onclick=function(){loadPosts(false)};
feedScroll.onscroll=function(){
if(feedScroll.scrollTop+feedScroll.clientHeight>=feedScroll.scrollHeight-10){
loadPosts(false);
}
};
function renderPost(docSnap){
const p=docSnap.data();
const id=docSnap.id;
const div=document.createElement('div');
div.className='card';
div.innerHTML='<div class="post-title">'+p.title+'</div><div class="name">posted by '+p.name+' • ID: '+id+'</div><div>'+p.content+'</div><button class="vote" id="vote_'+id+'">⬆ '+(p.upvotes||0)+'</button><div style="margin-top:10px"><input id="reply_'+id+'" placeholder="Reply..."><button onclick="addReply(\''+id+'\')">Reply</button></div><div id="replies_'+id+'"></div>';
feed.appendChild(div);
onSnapshot(doc(db,'posts',id),function(snap){var data=snap.data();var btn=document.getElementById('vote_'+id);if(btn){btn.textContent='⬆ '+(data.upvotes||0);btn.classList.add('bump');setTimeout(function(){btn.classList.remove('bump')},250);}});
document.getElementById('vote_'+id).onclick=function(){likePost(id)};
listenReplies(id);
div.onclick=function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;showExpandedPost(id)}}
window.likePost=async function(id){await updateDoc(doc(db,'posts',id),{upvotes:increment(1)});}
window.addReply=async function(postId){var input=document.getElementById('reply_'+postId);var text=input.value.trim();if(!text)return;await addDoc(collection(db,'posts/'+postId+'/replies'),{text:text,timestamp:Date.now()});input.value='';}
function listenReplies(postId){
var q1=query(collection(db,'posts/'+postId+'/replies'),orderBy('timestamp','asc'));
onSnapshot(q1,function(snap){var box=document.getElementById('replies_'+postId);if(!box)return;box.innerHTML='';snap.forEach(function(r){box.innerHTML+='<div class="reply">↳ '+r.data().text+'</div>'});});}
const chatBox=document.getElementById('chatBox');
document.getElementById('chatBtn').onclick=async function(){var msg=chatInput.value.trim();if(!msg)return;await addDoc(collection(db,'chat'),{msg:msg,timestamp:Date.now()});chatInput.value='';};
var chatQuery=query(collection(db,'chat'),orderBy('timestamp','asc'));
onSnapshot(chatQuery,function(snap){chatBox.innerHTML='';snap.forEach(function(c){chatBox.innerHTML+='<div>[ID:'+c.id+'] '+c.data().msg+'</div>'});chatBox.scrollTop=chatBox.scrollHeight;});
async function showExpandedPost(id){var snap=await getDocs(query(collection(db,'posts'),orderBy('timestamp','desc')));
var postDiv=document.createElement('div');postDiv.className='post-expanded';postDiv.id='expandedPost';
postDiv.innerHTML='<div class="modal-card" id="expandedCard"></div>';
document.body.appendChild(postDiv);
var card=document.getElementById('expandedCard');
var d=await getDocs(collection(db,'posts/'+id+'/replies'));
var postData=await getDocs(query(collection(db,'posts'),orderBy('timestamp','desc')));
card.innerHTML='';var docSnap=await getDocs(doc(db,'posts',id));var data=docSnap.data();
card.innerHTML+='<div class="post-title">'+data.title+'</div><div class="name">posted by '+data.name+'</div><div>'+data.content+'</div>';
var repliesBox=document.createElement('div');card.appendChild(repliesBox);
var rSnap=query(collection(db,'posts/'+id+'/replies'),orderBy('timestamp','asc'));
onSnapshot(rSnap,function(snap){repliesBox.innerHTML='';snap.forEach(function(r){repliesBox.innerHTML+='<div class="reply">↳ '+r.data().text+'</div>'});});
postDiv.onclick=function(e){if(e.target===postDiv) postDiv.remove();}};
loadPosts(true);
</script>
</body>
</html>
