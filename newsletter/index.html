<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto+Mono&display=swap" rel="stylesheet" />
<style>
/* ===== GLOBAL ===== */
body{
  font-family:"Montserrat",sans-serif;
  background:#0b0f14;
  color:#eee;
  margin:0;
  padding:0;
}
h1{
  text-align:center;
  padding:30px 0 10px;
  font-weight:700;
  font-size:2rem;
  color:#f5f5f5;
}

/* ===== CONTAINER ===== */
.container{
  display:flex;
  max-width:1000px;
  margin:0 auto;
  padding:20px;
  gap:20px;
}
.main{flex:2;}
.rightbar{flex:1;max-width:300px;}

/* ===== POST MODAL ===== */
#postModal{
  margin-bottom:25px;
  background:#161b22;
  padding:20px;
  border-radius:16px;
  box-shadow:0 8px 25px rgba(0,0,0,.5);
  transition:.2s;
  display:flex;
  flex-direction:column;
}
#postModal input,#postModal textarea{
  width:100%;
  margin:10px 0;
  padding:12px;
  border-radius:12px;
  border:1px solid #222a35;
  background:#0d1117;
  color:white;
  font-size:1rem;
  box-sizing:border-box;
  transition:.2s;
}
#postModal input:focus,#postModal textarea:focus{
  border-color:#3498db;
  outline:none;
}
#postModal button{
  align-self:flex-start;
  background:#e74c3c;
  border:none;
  padding:12px 18px;
  border-radius:12px;
  color:white;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}
#postModal button:hover{filter:brightness(1.15);}

/* ===== POST CARDS ===== */
.card{
  background:#161b22;
  padding:18px;
  margin-bottom:18px;
  border-radius:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.5);
  transition:.2s;
  cursor:pointer;
  overflow:hidden;
}
.card:hover{transform:translateY(-4px);}
.card-expanded{
  max-height:none;
  cursor:default;
}
.post-title{
  font-size:1.2rem;
  font-weight:700;
  margin-bottom:6px;
  color:#f5f5f5;
}
.post-name{
  color:#9aa4af;
  font-size:.85rem;
  margin-bottom:10px;
}
.vote{
  margin-top:12px;
  padding:6px 14px;
  border-radius:10px;
  cursor:pointer;
  background:#ff4500;
  color:white;
  border:none;
  font-weight:700;
}
.vote.bump{animation:bump .25s;}
@keyframes bump{50%{transform:scale(1.25);}}

/* ===== REPLIES ===== */
.reply-container{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #222a35;
}
.reply{
  background:#0d1117;
  padding:8px 12px;
  border-radius:12px;
  margin-bottom:8px;
}
.reply-author{
  font-weight:700;
  font-size:.85rem;
  color:#9aa4af;
  margin-bottom:3px;
}

/* ===== FEED SCROLL ===== */
.feed-scroll{
  max-height:calc(80vh);
  overflow:auto;
  padding-right:6px;
}

/* ===== CHAT ===== */
#chatBox{
  height:400px;
  overflow:auto;
  background:#0d1117;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
  font-size:.9rem;
  line-height:1.4;
}
#chatInput{
  width:100%;
  padding:10px;
  border-radius:12px;
  border:1px solid #222a35;
  background:#0d1117;
  color:white;
}
#chatBtn{
  width:100%;
  background:#3498db;
  padding:12px;
  margin-top:6px;
  border-radius:12px;
  border:none;
  color:white;
  cursor:pointer;
  font-weight:700;
  transition:.2s;
}
#chatBtn:hover{filter:brightness(1.15);}
</style>
</head>
<body>

<h1>Challenge Feed</h1>

<div class="container">
  <div class="main">
    <!-- POST MODAL -->
    <div id="postModal">
      <input id="name" placeholder="Your name">
      <input id="title" placeholder="Post title">
      <textarea id="content" placeholder="Write something..."></textarea>
      <button id="postBtn">Post</button>
    </div>

    <div class="feed-scroll" id="feed"></div>
  </div>

  <div class="rightbar">
    <h3>💬 Live Chat</h3>
    <div id="chatBox"></div>
    <input id="chatInput" placeholder="Message...">
    <button id="chatBtn">Send</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, query, orderBy, onSnapshot, increment, updateDoc, doc, limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyA-X3aamm3--C3OvknHs3nYUOcDChuNTC8",
  authDomain: "challenge-reddit.firebaseapp.com",
  projectId: "challenge-reddit",
  storageBucket: "challenge-reddit.firebasestorage.app",
  messagingSenderId: "366868697602",
  appId: "1:366868697602:web:08c3ffee581ab893388d1b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== DOM ELEMENTS =====
const feed = document.getElementById("feed");
const nameInput = document.getElementById("name");
const titleInput = document.getElementById("title");
const contentInput = document.getElementById("content");
const postBtn = document.getElementById("postBtn");

// ===== POST HANDLER =====
postBtn.onclick = async () => {
  const name = nameInput.value.trim();
  const title = titleInput.value.trim();
  const content = contentInput.value.trim();
  if (!name || !title || !content) return alert("Fill everything");

  await addDoc(collection(db, "posts"), {
    name, title, content, timestamp: Date.now(), upvotes: 0
  });

  nameInput.value = "";
  titleInput.value = "";
  contentInput.value = "";
};

// ===== LOAD POSTS (LIMIT 20) =====
const postQuery = query(collection(db, "posts"), orderBy("timestamp", "desc"), limit(20));
onSnapshot(postQuery, snapshot => {
  feed.innerHTML = "";
  snapshot.forEach(docSnap => {
    const p = docSnap.data();
    const id = docSnap.id;

    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="post-title">${p.title}</div>
      <div class="post-name">by ${p.name}</div>
      <div class="post-content-short">${p.content.length>100 ? p.content.substring(0,100)+"..." : p.content}</div>
      <button class="vote" id="vote_${id}">⬆ ${p.upvotes || 0}</button>
      <div class="reply-container" id="replies_${id}" style="display:none;">
        <div id="replyList_${id}"></div>
        <input placeholder="Write a reply..." id="replyInput_${id}" style="width:100%;margin-top:6px;padding:6px;border-radius:8px;border:1px solid #222a35;background:#0d1117;color:white;box-sizing:border-box;">
        <button id="replyBtn_${id}" style="margin-top:6px;background:#3498db;padding:6px 12px;border-radius:8px;border:none;color:white;cursor:pointer;font-weight:700;">Reply</button>
      </div>
    `;
    feed.appendChild(div);

    const btn = document.getElementById(`vote_${id}`);
    btn.onclick = async (e) => {
      e.stopPropagation();
      await updateDoc(doc(db,"posts",id),{upvotes:increment(1)});
    };

    onSnapshot(doc(db,"posts",id), snap => {
      const data = snap.data();
      btn.textContent = `⬆ ${data.upvotes || 0}`;
    });

    // EXPAND POST ON CLICK
    div.onclick = () => {
      const expanded = div.classList.contains("card-expanded");
      document.querySelectorAll(".card").forEach(c => c.classList.remove("card-expanded"));
      document.querySelectorAll(".reply-container").forEach(r=>r.style.display="none");
      if(!expanded){
        div.classList.add("card-expanded");
        document.getElementById(`replies_${id}`).style.display="block";
        loadReplies(id);
      }
    };

    // REPLY HANDLER
    const replyBtn = document.getElementById(`replyBtn_${id}`);
    const replyInput = document.getElementById(`replyInput_${id}`);
    replyBtn.onclick = async (e)=>{
      e.stopPropagation();
      const msg = replyInput.value.trim();
      if(!msg) return;
      await addDoc(collection(db,"replies_"+id),{msg, author:"Anonymous", timestamp:Date.now()});
      replyInput.value="";
    };

    async function loadReplies(postId){
      const replyList = document.getElementById(`replyList_${postId}`);
      const repliesQuery = query(collection(db,"replies_"+postId), orderBy("timestamp","asc"));
      onSnapshot(repliesQuery, snap=>{
        replyList.innerHTML="";
        snap.forEach(r=>{
          const div = document.createElement("div");
          div.className="reply";
          div.innerHTML=`<div class="reply-author">${r.data().author}</div>${r.data().msg}`;
          replyList.appendChild(div);
        });
      });
    }
  });
});

// ===== LIVE CHAT =====
const chatBox = document.getElementById("chatBox");
const chatInput = document.getElementById("chatInput");
const chatBtn = document.getElementById("chatBtn");

chatBtn.onclick = async () => {
  const msg = chatInput.value.trim();
  if (!msg) return;
  await addDoc(collection(db,"chat"), {msg, timestamp: Date.now()});
  chatInput.value = "";
};

const chatQuery = query(collection(db,"chat"), orderBy("timestamp","asc"));
onSnapshot(chatQuery, snap => {
  chatBox.innerHTML = "";
  snap.forEach(c => {
    chatBox.innerHTML += `<div>${c.data().msg}</div>`;
  });
  chatBox.scrollTop = chatBox.scrollHeight;
});
</script>
</body>
</html>
