<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto+Mono&display=swap" rel="stylesheet" />
<style>
/* ===== GLOBAL ===== */
body{
  font-family:"Montserrat",sans-serif;
  background:#0b0f14;
  color:#eee;
  margin:0;
  padding:0;
}
h1{text-align:center;padding:20px 0;font-weight:700;}

/* ===== CONTAINER ===== */
.container{
  display:flex;
  max-width:1000px;
  margin:0 auto;
  padding:20px;
  gap:20px;
}
.main{flex:2;}
.sidebar{flex:1;display:none;} /* optional */
.rightbar{flex:1;max-width:300px;}

/* ===== POST MODAL ===== */
#postModal{
  margin-bottom:20px;
  background:#161b22;
  padding:15px;
  border-radius:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
}
#postModal input,#postModal textarea{
  width:100%;
  margin:8px 0;
  padding:10px;
  border-radius:10px;
  border:1px solid #222a35;
  background:#0d1117;
  color:white;
  font-size:1rem;
}
#postModal button{
  background:#e74c3c;
  border:none;
  padding:10px 15px;
  border-radius:10px;
  color:white;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}
#postModal button:hover{filter:brightness(1.1);}

/* ===== POST CARDS ===== */
.card{
  background:#161b22;
  padding:15px;
  margin-bottom:16px;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
  transition:.2s;
}
.card:hover{transform:translateY(-3px);}
.post-title{font-size:1.1rem;font-weight:700;margin-bottom:5px;}
.post-name{color:#9aa4af;font-size:.85rem;margin-bottom:8px;}
.vote{margin-top:8px;padding:5px 10px;border-radius:8px;cursor:pointer;background:#ff4500;color:white;border:none;}
.vote.bump{animation:bump .25s;}
@keyframes bump{50%{transform:scale(1.25);}}

.feed-scroll{max-height:calc(80vh);overflow:auto;padding-right:6px;}

/* ===== CHAT ===== */
#chatBox{
  height:400px;
  overflow:auto;
  background:#0d1117;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
  font-size:.9rem;
}
#chatInput{width:100%;padding:8px;border-radius:10px;border:1px solid #222a35;background:#0d1117;color:white;}
#chatBtn{width:100%;background:#3498db;padding:10px;margin-top:5px;border-radius:10px;border:none;color:white;cursor:pointer;font-weight:700;}
#chatBtn:hover{filter:brightness(1.1);}
</style>
</head>
<body>

<h1>Challenge Feed</h1>

<div class="container">
  <div class="main">
    <!-- POST MODAL -->
    <div id="postModal">
      <input id="name" placeholder="Your name">
      <input id="title" placeholder="Post title">
      <textarea id="content" placeholder="Write something..."></textarea>
      <button id="postBtn">Post</button>
    </div>

    <div class="feed-scroll" id="feed"></div>
  </div>

  <div class="rightbar">
    <h3>💬 Live Chat</h3>
    <div id="chatBox"></div>
    <input id="chatInput" placeholder="Message...">
    <button id="chatBtn">Send</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, query, orderBy, onSnapshot, increment, updateDoc, doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyA-X3aamm3--C3OvknHs3nYUOcDChuNTC8",
  authDomain: "challenge-reddit.firebaseapp.com",
  projectId: "challenge-reddit",
  storageBucket: "challenge-reddit.firebasestorage.app",
  messagingSenderId: "366868697602",
  appId: "1:366868697602:web:08c3ffee581ab893388d1b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== DOM ELEMENTS =====
const feed = document.getElementById("feed");
const nameInput = document.getElementById("name");
const titleInput = document.getElementById("title");
const contentInput = document.getElementById("content");
const postBtn = document.getElementById("postBtn");

// ===== POST HANDLER =====
postBtn.onclick = async () => {
  const name = nameInput.value.trim();
  const title = titleInput.value.trim();
  const content = contentInput.value.trim();
  if (!name || !title || !content) return alert("Fill everything");

  await addDoc(collection(db, "posts"), {
    name, title, content, timestamp: Date.now(), upvotes: 0
  });

  nameInput.value = "";
  titleInput.value = "";
  contentInput.value = "";
};

// ===== LOAD POSTS =====
const postQuery = query(collection(db, "posts"), orderBy("timestamp", "desc"));
onSnapshot(postQuery, snapshot => {
  feed.innerHTML = "";
  snapshot.forEach(docSnap => {
    const p = docSnap.data();
    const id = docSnap.id;

    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="post-title">${p.title}</div>
      <div class="post-name">by ${p.name}</div>
      <div>${p.content}</div>
      <button class="vote" id="vote_${id}">⬆ ${p.upvotes || 0}</button>
    `;
    feed.appendChild(div);

    const btn = document.getElementById(`vote_${id}`);
    btn.onclick = async () => {
      await updateDoc(doc(db,"posts",id),{upvotes:increment(1)});
    };

    // live upvotes
    onSnapshot(doc(db,"posts",id), snap => {
      const data = snap.data();
      btn.textContent = `⬆ ${data.upvotes || 0}`;
    });
  });
});

// ===== LIVE CHAT =====
const chatBox = document.getElementById("chatBox");
const chatInput = document.getElementById("chatInput");
const chatBtn = document.getElementById("chatBtn");

chatBtn.onclick = async () => {
  const msg = chatInput.value.trim();
  if (!msg) return;
  await addDoc(collection(db,"chat"), {msg, timestamp: Date.now()});
  chatInput.value = "";
};

const chatQuery = query(collection(db,"chat"), orderBy("timestamp","asc"));
onSnapshot(chatQuery, snap => {
  chatBox.innerHTML = "";
  snap.forEach(c => {
    chatBox.innerHTML += `<div>${c.data().msg}</div>`;
  });
  chatBox.scrollTop = chatBox.scrollHeight;
});
</script>
</body>
</html>
